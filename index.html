    <script>
      (function() {
        // Intercept Vite HMR WebSocket in AI Studio iframe environment to prevent "closed without opened" rejection
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            var ws = new OrigWS(url, protocols);
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1))) {
              var origAdd = ws.addEventListener.bind(ws);
              ws.addEventListener = function(type, listener, options) {
                if (type === 'close') {
                  return origAdd(type, function(evt) {
                    if (ws.readyState === 1 || ws.__wasOpened) {
                      listener(evt);
                    }
                  }, options);
                }
                if (type === 'open') {
                  return origAdd(type, function(evt) {
                    ws.__wasOpened = true;
                    listener(evt);
                  }, options);
                }
                return origAdd(type, listener, options);
              };
            }
            return ws;
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }

        // Catch unhandled rejection and error events for any WebSocket disconnect
        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            e.preventDefault();
            e.stopPropagation && e.stopPropagation();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || String(e.error))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            e.preventDefault();
            e.stopPropagation && e.stopPropagation();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
